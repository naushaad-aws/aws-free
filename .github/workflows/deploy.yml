name: Destroy AWS Infrastructure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Empty S3 Buckets Direct via AWS CLI
        run: |
          # Finds any S3 bucket starting with 'my-website-bucket-' and empties it directly
          BUCKETS=$(aws s3api list-buckets --query "Buckets[?starts_with(Name, 'my-website-bucket-')].Name" --output text)
          for BUCKET in $BUCKETS; do
            if [ -n "$BUCKET" ] && [ "$BUCKET" != "None" ]; then
              echo "Emptying bucket: $BUCKET"
              aws s3 rm "s3://$BUCKET" --recursive || true
            fi
          done

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
        working-directory: ./terraform

